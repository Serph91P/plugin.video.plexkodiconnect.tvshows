name: Make Release

on:
  push:
    branches: [main]
    paths:
      - 'addon.xml'
      - 'changelog.txt'
      - 'default.py'
      - 'icon.png'
      - 'scripts/build_release.py'
      - '.github/workflows/make-release.yml'

permissions:
  contents: write

jobs:
  release:
    name: Make Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c 'import xml.etree.ElementTree as E; print(E.parse("addon.xml").getroot().attrib["version"])')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'filename=%s-%s.zip\n' "${{ github.event.repository.name }}" "$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify deterministic runtime archive
        run: |
          set -euo pipefail
          python scripts/build_release.py \
            --source . \
            --output "${{ steps.version.outputs.filename }}" \
            --expected-version "${{ steps.version.outputs.version }}"
          python scripts/build_release.py \
            --verify-only \
            --output "${{ steps.version.outputs.filename }}" \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing replacement"
            exit 1
          fi
          gh release create "$tag" \
            "${{ steps.version.outputs.filename }}" \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --notes-file changelog.txt
